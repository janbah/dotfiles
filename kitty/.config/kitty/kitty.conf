# Transparenz
background_opacity 0.85

# Schrift (Nerd Font, damit Icons auch im Terminal gehen)
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Innenabstand
window_padding_width 10
hide_window_decorations yes

# ===== Ozean-Theme =====
foreground            #e8f1f8
background            #0b1d2e
selection_foreground  #0b1d2e
selection_background  #7fb4d9
cursor                #7fb4d9
cursor_text_color     #0b1d2e
url_color             #7fb4d9


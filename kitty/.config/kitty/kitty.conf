# Transparenz
background_opacity 0.85

# Schrift (Nerd Font, damit Icons auch im Terminal gehen)
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Innenabstand
window_padding_width 10
hide_window_decorations yes

# ===== Ozean-Theme =====
# foreground            #e8f1f8
# background            #0b1d2e
# selection_foreground  #0b1d2e
# selection_background  #7fb4d9
# cursor                #7fb4d9
# cursor_text_color     #0b1d2e
# url_color             #7fb4d9

# schwarz
# color0  #1b3a57
# color8  #3d5a75
# rot
# color1  #e06c75
# color9  #ef8a93
# grün
# color2  #98c379
# color10 #b2d69a
# gelb
# color3  #f5c97b
# color11 #fadb9e
# blau
# color4  #61afef
# color12 #8cc7f5
# magenta
# color5  #c678dd
# color13 #d99ae8
# cyan
# color6  #56b6c2
# color14 #7fd0da
# weiß
# color7  #e8f1f8
# color15 #ffffff


# BEGIN_KITTY_THEME
# 3024 Day
include current-theme.conf
# END_KITTY_THEME

# ===== Schriftgröße mit Strg +/- / 0 =====
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0

# ===== Shell-Integration =====
# kitty soll die Cursorform nicht anfassen – die steuert der Vim-Modus der Shell
# (Strich = Einfügen, Block = Normalmodus)
shell_integration no-cursor

# ===== Komfort =====
scrollback_lines 20000
enable_audio_bell no
# Neuer Tab / neues Fenster startet im aktuellen Verzeichnis
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd